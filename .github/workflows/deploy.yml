name: Deploy Streamlit to Azure Web App

on:
  push:
    branches: [ main ]   # <-- change if your default branch is different
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: carbon-footprint-tracker   # <-- CHANGE to your App Service name
  PYTHON_VERSION: '3.12'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sanity import
        run: python - <<'PY'
from importlib import import_module
for m in ["streamlit","pandas","pymssql","sqlalchemy","pdfplumber"]:
    import_module(m)
print("Imports OK")
PY

      - name: Zip app
        run: zip -r app.zip . -x ".git/*"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: app.zip

      - name: Health check
        run: |
          sleep 15
          curl -f https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/ || (echo "Health check failed" && exit 1)

