name: Deploy Streamlit to Azure Web App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: carbon-footprint-tracker-d6hcdwdhaqaqe6hd
  AZURE_WEBAPP_HOSTNAME: carbon-footprint-tracker-d6hcdwdhaqaqe6hd.southindia-01.azurewebsites.net
  PYTHON_VERSION: '3.12'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Zip app
        run: zip -r app.zip . -x ".git/*"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: app.zip

      - name: Health check (retry)
        run: |
          URL="https://${{ env.AZURE_WEBAPP_HOSTNAME }}/"
          echo "Probing $URL ..."
          for i in {1..20}; do
            if curl -sf "$URL" >/dev/null; then
              echo "✅ App is responding"
              exit 0
            fi
            echo "Attempt $i failed; waiting 10s..."
            sleep 10
          done
          echo "Health check failed"
          exit 1

