name: Deploy to Azure Web App (simple)

on:
  push:
    branches: [ main ]     # change if your default branch is different
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: carbon-footprint-tracker-d6hcdwdhaqaqe6hd

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Zip everything in the repo (server will build from requirements.txt)
      - name: Zip app
        run: zip -r app.zip . -x ".git/*"

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: app.zip

